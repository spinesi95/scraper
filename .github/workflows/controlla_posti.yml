name: Controllo Posti Escursione

on:
  workflow_dispatch: # Permette di avviare lo script manualmente con un pulsante
  schedule:
    - cron: '0 8,14,20 * * *' # Opzionale: lo fa girare in automatico alle 8, alle 14 e alle 20 (orario UTC)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui lo script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report_prezzi.py # SOSTITUISCI CON IL NOME ESATTO DEL TUO SCRIPT PYTHON
